[project]
name = "synthguard"
version = "0.1.0"
description = "Local-first synthetic data quality gate with Streamlit and MCP interfaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["synthetic-data", "privacy", "data-quality", "mcp", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.13,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "scikit-learn>=1.7,<2",
    "sdmetrics>=0.30,<1",
    "sdv>=1.20,<2",
    "streamlit>=1.40,<2",
]

[project.scripts]
synthguard-mcp = "synthguard.mcp_server.server:run_server"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/docs",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synthguard"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sdmetrics.*", "sdv.*", "sklearn.*"]
ignore_missing_imports = true
